<style>
:root{--p:#4A3A80;--pd:#2C254F;--lav:#F1EEF9;--tint:#E4DFF2;--line:#DCD6EC;--line2:#ECE8F6;--ctl:#837AA2;--ink:#1B1726;--mut:#5A5470;--body:#33304A;--y:#FFD150;--yi:#594918;--ybg:#FFF3CC;--g:#2F8A4C;--gbg:#E3F4E7;--gi:#234A30;--abg:#FDEAE5;--ai:#4D2117;--a:#B4472B;--soft:#E2DCF4}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E7E3F1;font-family:'Outfit',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.hd{font-family:'Parkinsans','Outfit',sans-serif}
.h1{font-family:'Parkinsans','Outfit',sans-serif;font-size:26px;font-weight:700;line-height:1.2;margin:0}
.h2{font-family:'Parkinsans','Outfit',sans-serif;font-size:18px;font-weight:600;line-height:1.3;margin:0}
.cap{font-size:13px;line-height:1.4}
.mut{color:var(--mut)}
.sb{font-weight:600}
.lbl{font-size:13px;font-weight:600;letter-spacing:.06em}

/* layout */
.wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 24px 40px;min-height:100vh}
.topnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:0 6px 18px rgba(44,37,79,.08)}
.topnav .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.nums{display:flex;gap:2px}
.num{width:36px;height:36px;border-radius:18px;border:none;background:transparent;color:var(--p);font-size:15px;font-weight:600}
.num:hover{background:var(--lav)}
.num.on{background:var(--p);color:#fff}
.statesel{max-width:120px;height:36px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--p);font-size:13px;font-weight:600;padding:0 10px}
.iconbtn{width:36px;height:36px;border-radius:18px;border:none;background:transparent;color:var(--p);display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--lav)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.device{width:380px;height:820px;border-radius:44px;background:#1B1726;padding:10px;flex:none;box-shadow:0 30px 60px rgba(44,37,79,.25)}
.screen{width:360px;height:800px;border-radius:34px;overflow:hidden;position:relative;background:var(--lav);display:flex;flex-direction:column}
.adminwrap{width:100%;max-width:1360px;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(44,37,79,.18)}
@media (max-width:760px){
  .wrap{padding:0;gap:0}
  .device{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--lav)}
  .screen{width:100%;height:100dvh;border-radius:0}
  .topnav{order:2;margin:16px;border-radius:24px}
  .topnav img,.topnav .sep{display:none}
  .topnav{padding:6px}
  .adminwrap{border-radius:0;box-shadow:none}
}

/* app pieces */
.top{display:flex;align-items:center;gap:4px;padding:6px 12px 6px 6px}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--p);border:none;background:transparent;border-radius:12px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:0 16px 24px;display:flex;flex-direction:column;gap:16px}
.bar{padding:12px 16px 20px;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px}
.btn{height:52px;border-radius:14px;border:none;background:var(--p);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn2{height:52px;border-radius:14px;border:1.5px solid var(--ctl);background:#fff;color:var(--p);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btnoff{height:52px;border-radius:14px;border:none;background:var(--tint);color:var(--mut);font-size:16px;font-weight:600;width:100%;cursor:not-allowed}
.link{min-height:44px;border:none;background:transparent;color:var(--p);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;align-self:flex-start;white-space:nowrap}
.k-ready{background:var(--y);color:var(--yi)} .k-wait{background:var(--ybg);color:var(--yi)} .k-lock{background:var(--tint);color:var(--mut)} .k-done{background:var(--gbg);color:var(--gi)} .k-saved{background:var(--tint);color:var(--p)} .k-fail{background:var(--abg);color:var(--ai)} .k-chip{background:#fff;color:var(--p)}
.smsg{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.smsg img{width:52px;flex:none}
.chip{min-height:48px;padding:0 16px;border-radius:24px;border:1.5px solid var(--ctl);background:#fff;font-size:16px;font-weight:600}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.say{align-self:flex-start;max-width:300px;padding:10px 14px;border-radius:16px 16px 16px 4px;background:#fff}
.sheetbg{position:absolute;inset:0;background:rgba(27,23,38,.55);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:12px 20px 24px;display:flex;flex-direction:column;gap:14px}
.key{height:54px;border-radius:14px;border:1px solid var(--line);background:#fff;font-family:'Parkinsans','Outfit',sans-serif;font-size:22px;font-weight:600}
.kdel{height:54px;border:none;background:transparent;color:var(--p);display:flex;align-items:center;justify-content:center}
.pinbox{width:54px;height:58px;border-radius:14px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:var(--p)}
.seg{height:44px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--p);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;padding:0}
.seg.on{background:var(--p);border-color:var(--p);color:#fff}
.seg.done{background:var(--tint)}
.chk{width:100%;padding:12px 14px;border:none;border-bottom:1px solid var(--line2);background:transparent;display:flex;align-items:flex-start;gap:12px;text-align:left}
.chk:last-child{border-bottom:none}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ctl);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.chk.on .box{background:var(--p);border-color:var(--p)}
.chk.on .t{color:var(--mut)}
.switch{width:48px;height:28px;border-radius:14px;border:none;background:var(--ctl);position:relative;padding:0;flex:none}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.switch.on{background:var(--p)} .switch.on span{left:23px}
table{border-collapse:collapse;width:100%}
th{font-size:13px;font-weight:600;color:var(--mut);text-align:left;padding:12px 14px}
td{padding:12px 14px;border-top:1px solid var(--line2)}
input.field,textarea.field{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--ctl);background:#fff;font-size:16px;resize:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const SCREENS = [

];
const VALID = SCREENS.flatMap((g) => g[1].map((s) => s[0]));

function fresh() {
  return { screen: 'login', pin: '', showPin: false, err: true, prepDone: { 0: true, 1: true }, saved: true, data: false,
    stage: 0, sheet: false, run: false, secs: 0, ans: { 1: ['Do', 'Review', 'Learn', 'Apply'], 2: '45 to 60', 3: 'Most' },
    mb: { view: 'list', cur: 0, status: ['empty', 'empty'] }, sent: false,
    ad: { tab: 'sessions', stage: 0, preview: true, published: true, unlocked: {}, reset: {} } };
}
let S = fresh();

function go(name) {
  if (!VALID.includes(name)) name = 'login';
  const prev = S.screen; S.screen = name;
  if (name === 'login') { S.pin = ''; S.showPin = false; }
  if (name === 'wrongpin') { S.pin = ''; S.err = true; }
  if (name === 'prepare') S.saved = true;
  if (name === 'prepareOffline') S.saved = false;
  if (name === 'teach' && prev !== 'teach') { S.sheet = false; }
  if (name === 'makerbook' && prev !== 'makerbook') S.mb = { view: 'list', cur: 0, status: ['empty', 'empty'] };
  if (name === 'makerbookFailed') S.mb = { view: 'list', cur: 0, status: ['failed', 'failed'] };
  if (name === 'unlocked') { S.sent = false; clearTimeout(window._sentT); window._sentT = setTimeout(() => { S.sent = true; if (S.screen === 'unlocked') render(true); }, 2500); }
  if (location.hash !== '#' + name) history.pushState(null, '', '#' + name);
  render(false);
}
window.addEventListener('popstate', () => { const h = location.hash.slice(1); S.screen = VALID.includes(h) ? h : 'login'; render(false); });

  const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
  return `<div style="width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${labels.map((l) => l === '' ? '<div></div>' : (l === 'del' ? `<button class="kdel" data-act="pinDel" aria-label="Delete last digit">${ic('del', 26)}</button>` : `<button class="key" data-act="pinAdd" data-arg="${l}">${l}</button>`)).join('')}</div>`;
}
function pinBoxes(err) {
  return [0, 1, 2, 3].map((i) => { const ch = S.pin[i] ? (S.showPin ? S.pin[i] : '•') : ''; const col = err ? 'var(--a)' : (i === S.pin.length ? 'var(--p)' : (S.pin[i] ? 'var(--ctl)' : 'var(--line)')); return `<div class="pinbox" style="border-color:${col}">${ch}</div>`; }).join('');

    main = `<div style="display:flex;flex-direction:column;gap:16px"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px"><h1 class="h1">Fellows and PINs</h1><button class="btn" style="width:auto;height:48px;padding:0 18px;border-radius:12px">+ Add fellow</button></div>
      <div class="card" style="overflow-x:auto;border-radius:16px"><table style="min-width:680px"><thead><tr><th>Fellow</th><th>Phone set up</th><th>PIN</th><th>Setup code</th><th></th></tr></thead><tbody>
      ${data.map(([n, ph, pin, code], i) => { const r = !!A.reset[i]; const pp = r ? ['k-saved', 'New code sent'] : pin === 'active' ? ['k-done', 'Active'] : pin === 'locked' ? ['k-fail', 'Locked after 3 tries'] : ['k-lock', 'Not set']; return `<tr><td class="sb">${n}</td><td class="mut">${ph}</td><td><span class="pill ${pp[0]}">${pp[1]}</span></td><td class="hd sb" style="letter-spacing:.08em">${r ? 'MG8 2XP' : code}</td><td style="text-align:right"><button data-act="areset" data-arg="${i}" style="min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--ctl);background:#fff;color:var(--p);font-size:13px;font-weight:600">${r ? 'Done' : (pin === 'none' ? 'Share code' : 'Reset PIN')}</button></td></tr>`; }).join('')}
      </tbody></table></div><span class="cap mut">A reset makes a new one time setup code. The fellow enters it on the phone and chooses a new PIN.</span></div>`;
  }
  return `<div style="min-height:900px;background:var(--lav);display:flex;flex-direction:column">
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:center;gap:16px"><img src="${IMG.logo}" alt="MakerGhat" style="height:40px"><span style="width:1px;height:28px;background:var(--line)"></span><div style="display:flex;flex-direction:column"><span class="h2" style="color:var(--p)">Tinker Trail admin</span><span class="cap mut">Curriculum team · IGNITE Fellows Pilot</span></div></div>
    <nav aria-label="Admin sections" style="display:flex;flex-wrap:wrap;gap:6px;padding:4px;border-radius:14px;background:var(--lav)">${tabs}</nav></div>
    <main style="width:100%;max-width:1360px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px">${main}</main></div>`;
}

/* ---------- render ---------- */
function screenHTML() {
  switch (S.screen) {
    case 'login': return loginScreen(false);
    case 'wrongpin': return loginScreen(true);
    case 'setup': return setupScreen();
    case 'home': return homeScreen('today');
    case 'homeAfter': return homeScreen('after');
    case 'homeEmpty': return homeScreen('empty');
    case 'prepare': return prepareScreen(false);
    case 'prepareOffline': return prepareScreen(true);
    case 'teach': return teachScreen();
    case 'observe': return observeScreen();
    case 'makerbook': return makerbookScreen(false);
    case 'makerbookFailed': return makerbookScreen(true);
    case 'unlocked': return unlockedScreen();
    default: return loginScreen(false);
  }
}
function panelHTML() {
  const main = SCREENS[0][1].concat(SCREENS[2][1]).map(([k, l]) => [k, l, parseInt(l, 10)]).sort((a, b) => a[2] - b[2]);
  const states = SCREENS[1][1];
  const inState = states.some(([k]) => k === S.screen);
  return `<header class="topnav" aria-label="Prototype screens">
    <img src="${IMG.hand}" alt="MakerGhat" style="width:26px;height:26px">
    <span class="sep"></span>
    <nav class="nums" aria-label="Main flow">${main.map(([k, l, n]) => `<button class="num ${S.screen === k ? 'on' : ''}" data-act="go" data-arg="${k}" title="${esc(l.replace(/^\d+\s*/, ''))}" aria-label="${esc(l)}">${n}</button>`).join('')}</nav>
    <span class="sep"></span>
    <label class="sr" for="stateSel">Other states</label>
    <select id="stateSel" class="statesel"><option value="" ${inState ? '' : 'selected'}>States</option>${states.map(([k, l]) => `<option value="${k}" ${S.screen === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
    <button class="iconbtn" data-act="restart" title="Restart demo" aria-label="Restart demo">${ic('restart', 18)}</button>
  </header>`;
}
document.addEventListener('change', (e) => { if (e.target.id === 'stateSel' && e.target.value) go(e.target.value); });
function render(keepScroll) {
  const sc = document.querySelector('.screen .scroll');
  const y = keepScroll && sc ? sc.scrollTop : 0;
  const app = document.getElementById('app');
  const isAdmin = S.screen === 'admin';
  app.innerHTML = `<div class="wrap">${panelHTML()}${isAdmin ? `<div class="adminwrap">${adminScreen()}</div>` : `<div class="device"><div class="screen">${screenHTML()}</div></div>`}</div>`;
  fitDevice();
  const sc2 = document.querySelector('.screen .scroll');
  if (sc2) sc2.scrollTop = y;
  if (!keepScroll) window.scrollTo(0, 0);
}

function fitDevice() {
  const d = document.querySelector('.device'); if (!d) return;
  if (window.innerWidth <= 760) { d.style.zoom = ''; return; }
  const nav = document.querySelector('.topnav'); const used = (nav ? nav.offsetHeight : 50) + 60;
  const z = Math.min(1, Math.max(0.6, (window.innerHeight - used) / 820));
  d.style.zoom = z;
}
window.addEventListener('resize', fitDevice);
/* ---------- actions ---------- */
const ACT = {
  go: (a) => go(a), noop: () => {},
  restart: () => { S = fresh(); go('login'); },
  pinAdd: (d) => { if (S.pin.length < 4) { S.pin += d; S.err = false; } render(true); },
  pinDel: () => { S.pin = S.pin.slice(0, -1); render(true); },
  toggleShow: () => { S.showPin = !S.showPin; render(true); },
  start: () => go(S.screen === 'login' && S.pin === '0000' ? 'wrongpin' : 'home'),
  toggleSave: () => { S.saved = !S.saved; render(true); },
  toggleData: () => { S.data = !S.data; render(true); },
  togglePrep: (i) => { S.prepDone[i] = !S.prepDone[i]; render(true); },
  stage: (i) => { S.stage = +i; S.secs = 0; S.sheet = false; render(false); },
  timer: () => { S.run = !S.run; render(true); },
  sheet: () => { S.sheet = true; render(true); },
  closeSheet: () => { S.sheet = false; render(true); },
  closeSheetBg: (a, e) => { if (e.target.classList.contains('sheetbg')) { S.sheet = false; render(true); } },
  ans: (arg) => { const [n, o, m] = arg.split('|'); if (m === '1') { const c = S.ans[n] || []; S.ans[n] = c.includes(o) ? c.filter((x) => x !== o) : c.concat([o]); } else S.ans[n] = S.ans[n] === o ? null : o; render(true); },
  snap: (i) => { S.mb.cur = +i; S.mb.view = 'camera'; render(false); },
  mb: (v) => { S.mb.view = v; render(false); },
  usePhoto: () => { S.mb.status[S.mb.cur] = 'saved'; S.mb.view = 'list'; render(false); },
  retry: () => { S.mb.status = ['sending', 'sending']; render(true); },
  atab: (t) => { S.ad.tab = t; render(false); },
  astage: (i) => { S.ad.stage = +i; render(true); },
  apreview: () => { S.ad.preview = !S.ad.preview; render(true); },
  apublish: () => { S.ad.published = !S.ad.published; render(true); },
  aunlock: (i) => { S.ad.unlocked[i] = true; render(true); },
  areset: (i) => { S.ad.reset[i] = true; render(true); }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) f(el.dataset.arg, e);
});
setInterval(() => {
  if (S.screen === 'teach' && S.run) {
    S.secs++; const tb = timerBits();
    const t = document.getElementById('timerText'); const p = document.getElementById('pace');
    if (t) t.textContent = tb.text; if (p) { p.textContent = tb.pace; p.style.color = tb.paceCol; }
  }
}, 1000);

const start = location.hash.slice(1);
S.screen = VALID.includes(start) ? start : 'login';
if (S.screen === 'prepareOffline') S.saved = false;
if (S.screen === 'makerbookFailed') S.mb.status = ['failed', 'failed'];
render(false);
</script>
</body>
</html>
